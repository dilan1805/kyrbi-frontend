<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Crear Cuenta - Kyrbi</title>
    <link rel="icon" href="assets/img/favicon.svg" type="image/svg+xml" />
    <link rel="stylesheet" href="assets/css/styles.css">
    <link rel="stylesheet" href="assets/css/auth.css">
    <!-- FontAwesome for Icons -->
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
</head>
<body class="auth-page">
    <div class="auth-container">
        <div class="auth-card">
            <div class="auth-header">
                <a href="index.html" class="auth-logo">
                    <img src="assets/img/logo.svg" alt="Kyrbi Logo">
                </a>
                <h1>Crea tu cuenta</h1>
                <p>Empieza tu camino hacia hábitos más saludables</p>
            </div>

            <div id="error-message" class="auth-error" style="display: none;"></div>

            <!-- Social Register -->
            <div class="social-login">
                <button type="button" class="button button--social social-google" onclick="window.location.href='/api/auth/google'">
                    <i class="fab fa-google"></i>
                    Registrarse con Google
                </button>
                <button type="button" class="button button--social social-google" onclick="window.location.href='/api/auth/gmail'">
                    <i class="fas fa-envelope"></i>
                    Registrarse con Gmail
                </button>
                <button type="button" class="button button--social social-facebook" onclick="window.location.href='/api/auth/facebook'">
                    <i class="fab fa-facebook-f"></i>
                    Registrarse con Facebook
                </button>
                <div style="display: flex; gap: 1rem;">
                    <button type="button" class="button button--social social-github" onclick="window.location.href='/api/auth/github'">
                        <i class="fab fa-github"></i>
                        GitHub
                    </button>
                    <button type="button" class="button button--social social-microsoft" onclick="window.location.href='/api/auth/microsoft'">
                        <i class="fab fa-microsoft"></i>
                        Microsoft
                    </button>
                </div>
            </div>

            <div class="divider">
                <span>o con tu correo</span>
            </div>

            <form id="register-form" class="auth-form">
                <div class="form-group">
                    <label for="username">Nombre de usuario</label>
                    <input type="text" id="username" name="username" placeholder="Como quieres que te llamemos" required>
                </div>

                <div class="form-group">
                    <label for="email">Correo electrónico</label>
                    <input type="email" id="email" name="email" placeholder="tucorreo@ejemplo.com" required>
                </div>

                <div class="form-group">
                    <label for="password">Contraseña</label>
                    <input type="password" id="password" name="password" placeholder="Mínimo 6 caracteres" minlength="6" required>
                </div>

                <div class="form-group">
                    <label for="confirm-password">Confirmar contraseña</label>
                    <input type="password" id="confirm-password" name="confirm-password" placeholder="Repite tu contraseña" minlength="6" required>
                </div>

                <div class="form-actions">
                    <button type="submit" class="button button--primary button--full">Crear cuenta</button>
                </div>
            </form>

            <div class="auth-footer">
                <p>¿Ya tienes cuenta? <a href="login.html">Inicia sesión</a></p>
            </div>
        </div>
    </div>

    <script src="assets/js/api.js"></script>
    <script src="assets/js/auth.js"></script>
    <script>
      // Theme handling
      const savedTheme = localStorage.getItem('theme') || 'light';
      document.documentElement.setAttribute('data-theme', savedTheme);
      
      // Handle URL params if redirected from social login with error
      window.addEventListener('load', () => {
        const urlParams = new URLSearchParams(window.location.search);
        const error = urlParams.get('error');
        if (error) {
            const errorDiv = document.getElementById('error-message');
            errorDiv.textContent = decodeURIComponent(error);
            errorDiv.style.display = 'flex';
        }
      });
    </script>
</body>
</html>
