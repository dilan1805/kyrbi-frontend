<!doctype html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Iniciar Sesion - Kyrbi</title>
    <link rel="icon" href="assets/img/favicon.svg" type="image/svg+xml" />

    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600&family=Outfit:wght@500;600;700&display=swap" rel="stylesheet">

    <link rel="stylesheet" href="assets/css/styles.css" />
    <link rel="stylesheet" href="assets/css/auth.css" />
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
</head>
<body class="auth-page">
    <div class="auth-container reveal reveal--up">
        <div class="auth-card panel float">
            <div class="auth-header reveal reveal--up" style="transition-delay: 0.1s;">
                <a href="index.html" class="auth-logo" aria-label="Volver al inicio">
                    <img src="assets/img/logo.svg" alt="Kyrbi Logo" width="60" height="60">
                </a>
                <h1>Hola de nuevo</h1>
                <p>Ingresa para continuar tu progreso</p>
            </div>

            <div id="error-message" class="auth-error" style="display: none;"></div>

            <div class="social-login reveal reveal--up" style="transition-delay: 0.2s;">
                <button type="button" class="button button--social social-google" onclick="window.location.href='/api/auth/google'">
                    <i class="fab fa-google"></i>
                    Continuar con Google
                </button>
                <button type="button" class="button button--social social-google" onclick="window.location.href='/api/auth/gmail'">
                    <i class="fas fa-envelope"></i>
                    Continuar con Gmail
                </button>
                <button type="button" class="button button--social social-facebook" onclick="window.location.href='/api/auth/facebook'">
                    <i class="fab fa-facebook-f"></i>
                    Continuar con Facebook
                </button>
            </div>

            <div class="divider reveal reveal--up" style="transition-delay: 0.3s;">
                <span>o usa tu correo electronico</span>
            </div>

            <form id="login-form" class="auth-form reveal reveal--up" style="transition-delay: 0.4s;">
                <div class="form-group">
                    <label for="email">Correo electronico</label>
                    <input type="email" id="email" name="email" autocomplete="username email" inputmode="email" placeholder="nombre@ejemplo.com" required>
                </div>

                <div class="form-group">
                    <label for="password">Contrasena</label>
                    <input type="password" id="password" name="password" autocomplete="current-password" placeholder="Minimo 6 caracteres" minlength="6" required>
                </div>

                <div class="form-options">
                    <label class="remember-me">
                        <input type="checkbox" id="remember" name="remember">
                        Recordarme
                    </label>
                    <a href="#" id="forgot-link" class="forgot-password">Olvidaste tu contrasena?</a>
                </div>

                <div class="form-actions">
                    <button type="submit" class="button button--primary button--full">Iniciar Sesion</button>
                </div>
            </form>

            <div class="auth-footer reveal reveal--up" style="transition-delay: 0.5s;">
                <p>Aun no tienes cuenta? <a href="register.html">Crear cuenta gratis</a></p>
            </div>
        </div>
    </div>

    <div class="toast-container" id="toast-container" aria-live="polite" aria-atomic="true"></div>

    <script src="assets/js/api.js"></script>
    <script src="assets/js/auth.js"></script>
    <script src="assets/js/ui-enhancements.js" defer></script>
    <script>
      const savedTheme = localStorage.getItem("theme") || "light";
      document.documentElement.setAttribute("data-theme", savedTheme);
    </script>
</body>
</html>
