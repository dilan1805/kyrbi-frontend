<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Iniciar Sesión - Kyrbi</title>
    <link rel="icon" href="assets/img/favicon.svg" type="image/svg+xml" />
    <link rel="stylesheet" href="assets/css/styles.css">
    <link rel="stylesheet" href="assets/css/auth.css">
    <!-- FontAwesome for Icons -->
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
</head>
<body class="auth-page">
    <div class="auth-container">
        <div class="auth-card">
            <div class="auth-header">
                <a href="index.html" class="auth-logo">
                    <span class="brand__mark" aria-hidden="true"></span>
                    Kyrbi
                </a>
                <h1>¡Hola de nuevo!</h1>
                <p>Ingresa para continuar tu progreso</p>
            </div>

            <div id="error-message" class="auth-error" style="display: none;"></div>

            <!-- Social Login -->
            <div class="social-login">
                <button type="button" class="button button--social social-google" onclick="window.location.href='/api/auth/google'">
                    <i class="fab fa-google"></i>
                    Continuar con Google
                </button>
                <button type="button" class="button button--social social-google" onclick="window.location.href='/api/auth/gmail'">
                    <i class="fas fa-envelope"></i>
                    Continuar con Gmail
                </button>
                <button type="button" class="button button--social social-facebook" onclick="window.location.href='/api/auth/facebook'">
                    <i class="fab fa-facebook-f"></i>
                    Continuar con Facebook
                </button>
                <div style="display: flex; gap: 1rem;">
                    <button type="button" class="button button--social social-github" onclick="window.location.href='/api/auth/github'">
                        <i class="fab fa-github"></i>
                        GitHub
                    </button>
                    <button type="button" class="button button--social social-microsoft" onclick="window.location.href='/api/auth/microsoft'">
                        <i class="fab fa-microsoft"></i>
                        Microsoft
                    </button>
                </div>
            </div>

            <div class="divider">
                <span>o usa tu correo electrónico</span>
            </div>

            <form id="login-form" class="auth-form">
                <div class="form-group">
                    <label for="email">Correo electrónico</label>
                    <input type="email" id="email" name="email" placeholder="nombre@ejemplo.com" required>
                </div>

                <div class="form-group">
                    <label for="password">Contraseña</label>
                    <input type="password" id="password" name="password" placeholder="••••••••" required>
                </div>
              
                <div class="form-options">
                    <label class="remember-me">
                        <input type="checkbox" id="remember" name="remember">
                        Recordarme
                    </label>
                    <a href="#" id="forgot-link" class="forgot-password">¿Olvidaste tu contraseña?</a>
                </div>

                <div class="form-actions">
                    <button type="submit" class="button button--primary">Iniciar Sesión</button>
                </div>
            </form>

            <div class="auth-footer">
                <p>¿Aún no tienes cuenta? <a href="register.html">Crear cuenta gratis</a></p>
            </div>
        </div>
    </div>

    <script src="assets/js/api.js"></script>
    <script src="assets/js/auth.js"></script>
    <script>
      // Theme handling
      const savedTheme = localStorage.getItem('theme') || 'light';
      document.documentElement.setAttribute('data-theme', savedTheme);
      
      // Handle URL params (token from social login)
      window.addEventListener('load', () => {
        const urlParams = new URLSearchParams(window.location.search);
        const token = urlParams.get('token');
        const username = urlParams.get('username');
        const id = urlParams.get('id');
        const error = urlParams.get('error');

        if (token && window.KyrbiAPI) {
            window.KyrbiAPI.setToken(token);
            const user = { id, username, email: '' }; // Basic user info
            localStorage.setItem('kyrbi_user', JSON.stringify(user));
            window.location.href = 'dashboard.html';
        }

        if (error) {
            const errorDiv = document.getElementById('error-message');
            errorDiv.textContent = decodeURIComponent(error);
            errorDiv.style.display = 'flex';
        }
      });
    </script>
</body>
</html>
