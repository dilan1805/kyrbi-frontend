<svg width="100" height="100" viewBox="0 0 100 100" fill="none" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <linearGradient id="logo-grad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0ea5e9" />
      <stop offset="100%" stop-color="#2dd4bf" />
    </linearGradient>
    <filter id="shadow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur in="SourceAlpha" stdDeviation="2" />
      <feOffset dx="0" dy="1" />
      <feComponentTransfer>
        <feFuncA type="linear" slope="0.2" />
      </feComponentTransfer>
      <feMerge>
        <feMergeNode />
        <feMergeNode in="SourceGraphic" />
      </feMerge>
    </filter>
  </defs>

  <!-- Background Glow -->
  <circle cx="50" cy="50" r="40" fill="url(#logo-grad)" opacity="0.1" />

  <!-- Lotus Petals (Modern Fluid Style) -->
  <g filter="url(#shadow)">
    <!-- Central Petal -->
    <path d="M50 20C50 20 42 35 42 45C42 55 50 65 50 65C50 65 58 55 58 45C58 35 50 20 50 20Z" fill="url(#logo-grad)" />
    
    <!-- Left Petals -->
    <path d="M48 62C48 62 30 58 22 48C14 38 15 25 15 25C15 25 22 45 35 55C42 60 48 62 48 62Z" fill="url(#logo-grad)" opacity="0.8" />
    <path d="M48 62C48 62 25 68 15 75C5 82 8 95 8 95C8 95 18 90 35 80C45 72 48 62 48 62Z" fill="url(#logo-grad)" opacity="0.6" />
    
    <!-- Right Petals -->
    <path d="M52 62C52 62 70 58 78 48C86 38 85 25 85 25C85 25 78 45 65 55C58 60 52 62 52 62Z" fill="url(#logo-grad)" opacity="0.8" />
    <path d="M52 62C52 62 75 68 85 75C95 82 92 95 92 95C92 95 82 90 65 80C55 72 52 62 52 62Z" fill="url(#logo-grad)" opacity="0.6" />
  </g>

  <!-- Meditation Figure (Abstract Minimalist) -->
  <g fill="white">
    <!-- Head -->
    <circle cx="50" cy="42" r="5" />
    <!-- Body -->
    <path d="M50 48C45 48 42 53 42 58C42 63 45 65 50 65C55 65 58 63 58 58C58 53 55 48 50 48Z" />
    <!-- Legs (Lotus position) -->
    <path d="M42 62C38 62 32 68 32 72C32 75 35 75 40 73L50 65L60 73C65 75 68 75 68 72C68 68 62 62 58 62" stroke="white" stroke-width="2" stroke-linecap="round" />
  </g>
</svg>
